[project]
name = "school-timetable-backend"
version = "0.1.0"
description = "高一（1）部排课系统后端"
requires-python = ">=3.11"
dependencies = [
    "django>=5.0",
    "djangorestframework>=3.15",
    "djangorestframework-simplejwt>=5.4",
    "django-cors-headers>=4.5",
    "python-decouple>=3.8",
    "python-dotenv>=1.0",
    "drf-spectacular>=0.27",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "gunicorn>=21.2",
]

# 固定项目使用的镜像源（国内），避免不同机器全局配置不同导致 uv.lock 反复改写
[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true
